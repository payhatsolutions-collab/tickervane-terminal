.film{min-height:100svh;display:flex;flex-direction:column;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 79% 39%,#263b32 0%,#15221c 20%,#0d1512 35%,transparent 61%),linear-gradient(112deg,#0b0d0d,#080b0a 62%,#101411)}
.film::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.045;z-index:-1;background-image:var(--grain);background-size:150px}
.wrap{width:min(100% - clamp(40px,9vw,168px),1580px);margin-inline:auto}
header{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule);position:relative;z-index:3}
.brand{display:inline-flex;align-items:center;gap:11px;font-size:24px;font-weight:650;letter-spacing:-1.4px}.brand i{display:block;width:26px;height:32px;position:relative;background:linear-gradient(135deg,#fff 12%,#c2e8c6 43%,#689674 57%,#eff7f0 82%);clip-path:polygon(50% 0,62% 34%,100% 51%,63% 61%,50% 100%,39% 64%,0 51%,36% 38%)}.brand i:after{content:"";position:absolute;inset:32% 36%;background:#14281b;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.header-label,.eyebrow,.caption,.time,.strip-label{font:500 12px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.12em}.header-label{color:#acb9b0}
.hero{position:relative;flex:1;display:grid;grid-template-columns:46% 54%;align-items:center;min-height:clamp(510px,65vh,850px);padding-block:32px 42px}
.copy{z-index:2;position:relative}.eyebrow{display:flex;gap:12px;align-items:center;color:var(--mint);margin:0 0 25px;font-weight:600}.eyebrow:before{content:"";width:28px;height:2px;background:var(--mint)}
h1{font-size:clamp(63px,7.8vw,142px);line-height:.94;letter-spacing:-.076em;margin:0;font-weight:560}h1 span,h1 em{display:block;white-space:nowrap}h1 em{font:italic 1.05em/.99 "New York",Baskerville,Georgia,serif;letter-spacing:-.07em;color:#c8e5cc}
.description{font-size:clamp(16px,1.28vw,22px);line-height:1.5;letter-spacing:-.019em;color:#b2beb6;max-width:34ch;margin:25px 0 31px}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:15px 24px;border-radius:100px;background:#eff5ed;color:#102215;font-size:15px;font-weight:650;transition:background .2s,transform .2s}.cta:hover{background:#cdf3d4;transform:translateY(-2px)}.cta:active{transform:translateY(0)}.chart-icon{width:16px;height:15px;display:inline-flex;align-items:flex-end;gap:2px}.chart-icon i{width:3px;background:#254b32}.chart-icon i:nth-child(1){height:6px}.chart-icon i:nth-child(2){height:11px}.chart-icon i:nth-child(3){height:8px}.chart-icon i:nth-child(4){height:15px}
.stage{height:100%;min-height:420px;display:grid;place-items:center;position:relative;perspective:1050px;isolation:isolate}
.halo{position:absolute;pointer-events:none;background:radial-gradient(ellipse,rgba(165,228,184,.12),transparent 66%);width:138%;height:116%}
.orbit{width:110%;position:absolute;aspect-ratio:1;border:1px solid rgba(144,196,161,.19);border-radius:50%;transform:rotate(-32deg) scaleY(.62);z-index:-1}
.orbit:after{content:"";position:absolute;inset:48% auto auto -2px;width:5px;height:5px;border-radius:50%;background:#b7d5bf;box-shadow:0 0 10px #9aea9d}
.orbit.faint{transform:rotate(22deg) scaleY(.8);width:99%;opacity:.25}
.prop{position:relative;display:grid;place-items:center;width:100%;height:100%;min-height:inherit;transform-style:preserve-3d;transition:transform .45s ease-out;transform:rotateX(var(--tiltY,0deg)) rotateY(var(--tiltX,0deg))}
.medal{width:min(84%,58vh,650px);aspect-ratio:1;position:relative;transform-style:preserve-3d;transform:rotateX(13deg) rotateY(-23deg) rotateZ(-13deg);animation:arrive 1.8s cubic-bezier(.16,.84,.25,1) both}
.edge,.face,.bull{position:absolute}.edge{inset:0;border-radius:50%;background:repeating-conic-gradient(from 20deg,#65736c 0deg,#25312c .39deg,#0e1713 .8deg,#a0a99e 1deg);transform:translate3d(7px,9px,-10px);box-shadow:5px 16px 19px #0009,13px 34px 45px #000b}.face{inset:0;width:100%;filter:drop-shadow(1px 2px 2px #041006);transform:translateZ(0)}.bull{width:83%;left:8%;top:21%;transform:translateZ(15px) rotate(6deg);filter:saturate(.36) brightness(1.39) drop-shadow(1px 9px 6px #000c)}

.screen{margin:0;width:min(84%,520px);padding:7px;border:1px solid #809689;border-radius:22px;background:linear-gradient(140deg,#9bac9f,#35413b 8%,#18231c 45%,#87958c 96%,#26372a);box-shadow:6px 8px 0 #16261b,12px 22px 40px #0009;transform:rotateY(-15deg) rotateX(5deg) rotateZ(-4deg);animation:reveal .75s ease-out both}
.screen img{display:block;width:100%;max-height:47vh;object-fit:contain;object-position:center;border-radius:15px;background:#101614}.screen.chart img{background:#faf8f1}.screen figcaption{padding:8px 7px 1px;color:#c5cdc5;font:11px/1.3 var(--mono);text-align:center;letter-spacing:.03em}

  target.search = new URLSearchParams({symbol:'MCX.NS',...(isChart ? {range:'6mo'} : {}), utm_source:'html_ad',utm_medium:'creative',utm_campaign:'behind_the_breakout',utm_content:scene.art});
  cta.href = target.href;
  const openingArt = scene.art === 'medal';
  medal.hidden = !openingArt;
  screen.hidden = openingArt;
  if (!openingArt) {
    snapshot.src = photos[scene.art];
    snapshot.alt = scene.kicker + '. ' + scene.body;
    const market = isChart || scene.art === 'levels';
    caption.textContent = 'MCX · ' + (market ? 'Market snapshot · 13 Nov 2026' : 'Company report · 10 Nov 2026');
    screen.classList.toggle('chart', market);
  }
  if (!reduced.matches) {
    const shotDuration = (scenes[i+1]?.at ?? endTime/1000)*1000 - scene.at*1000;
    const subject = openingArt ? medal : screen;
    const poses = openingArt
      ? ['rotateX(16deg) rotateY(-33deg) rotateZ(-15deg) scale(.96)','rotateX(9deg) rotateY(-15deg) rotateZ(-10deg) scale(1.04)']
      : ['rotateY(-13deg) rotateX(5deg) rotateZ(-3deg) scale(.96)','rotateY(-4deg) rotateX(1deg) rotateZ(-1deg) scale(1.03)'];
    animations.push(subject.animate(poses.map(transform=>({transform})),{duration:shotDuration,fill:'forwards',easing:'ease-in-out'}));
    if(i > 0) animations.push(document.querySelector('.copy').animate([{opacity:.35,transform:'translateY(7px)'},{opacity:1,transform:'none'}],{duration:480,fill:'both'}));
  }
  index = i;
}
function sync() {
  const now = Math.min(endTime, elapsed + (startedAt === undefined ? 0 : performance.now()-startedAt));
  let next = 0;
  while(next+1 < scenes.length && scenes[next+1].at*1000 <= now) next++;
  if(next !== index) showShot(next);
  if(now >= endTime) {
    elapsed = endTime;
    startedAt = undefined;
    film.dataset.ended = 'true';
    animations.forEach(a=>a.finish());
    return;
  }
  const boundary = (scenes[next+1]?.at ?? endTime/1000)*1000;
  timer = setTimeout(sync,Math.max(1,Math.ceil(boundary-now)));
}
function visibilityChanged() {
  clearTimeout(timer);
  if(document.hidden) {
    if(startedAt !== undefined) elapsed = Math.min(endTime,elapsed+performance.now()-startedAt);
    startedAt = undefined;
    film.dataset.hold = '';
    animations.forEach(a=>a.pause());
  } else if(elapsed < endTime) {
    delete film.dataset.hold;
    startedAt = performance.now();
    animations.forEach(a=>a.play());
    sync();
  }
}
document.addEventListener('visibilitychange',visibilityChanged);
reduced.addEventListener('change',()=>{if(reduced.matches){animations.forEach(a=>a.cancel());animations=[];stage.removeAttribute('style')}});
stage.addEventListener('pointermove',event=>{
  if(reduced.matches || event.pointerType !== 'mouse') return;
  const rect = stage.getBoundingClientRect();
  stage.style.setProperty('--tiltX',((event.clientX-rect.left)/rect.width-.5)*10+'deg');
  stage.style.setProperty('--tiltY',(.5-(event.clientY-rect.top)/rect.height)*7+'deg');
});
stage.addEventListener('pointerleave',()=>{stage.style.removeProperty('--tiltX');stage.style.removeProperty('--tiltY')});
showShot(0);
visibilityChanged();
